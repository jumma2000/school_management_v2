<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}نظام إدارة المدرسة{% endblock %}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f4f6f9; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background-color: #1e3a8a; } 
        .navbar-brand, .nav-link { color: white !important; font-weight: 600; }
        .nav-link:hover { color: #fbbf24 !important; } 
        .card { border-radius: 10px; }
        .main-content { flex: 1; }
    </style>
</head>
<body>

    <!-- استدعاء شريط التنقل -->
    {% include 'pages/navbar.html' %}

    <!-- المحتوى الرئيسي -->
    <div class="container main-content">
        
        <!-- رسائل التنبيه -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm mt-3" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <!-- هنا يتم وضع محتوى كل صفحة -->
        {% block content %}
        {% endblock content %}
        
    </div>

    <!-- استدعاء التذييل -->
    {% include 'pages/footer.html' %}

    <!-- السكربتات -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var alerts = document.querySelectorAll('.alert');
            alerts.forEach(function(alert) {
                setTimeout(function() {
                    alert.classList.remove('show');
                    alert.classList.add('fade');
                    setTimeout(function() { alert.remove(); }, 500); 
                }, 3500);
            });
        });
    </script>
</body>
</html>
