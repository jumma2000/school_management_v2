{% extends 'base.html' %}

{% block title %}تسجيل دفعة{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white pb-0">
                <h4 class="fw-bold"><i class="bi bi-cash-coin text-success"></i> تسجيل دفعة</h4>
                <p class="text-muted small mb-0">الطالب: <span class="fw-bold text-dark">{{ student.name }}</span></p>
                <p class="text-muted small mb-0">المتبقي عليه: <span class="text-danger fw-bold">{{ student.balance|floatformat:2 }} د.ل</span></p>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">المبلغ المدفوع (د.ل)</label>
                        <input type="number" step="0.01" name="amount" class="form-control form-control-lg text-center" required placeholder="0.00">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">ملاحظات (اختياري)</label>
                        <input type="text" name="note" class="form-control" placeholder="مثال: الدفعة الأولى">
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg"><i class="bi bi-check-circle"></i> حفظ الدفعة</button>
                        <a href="{% url 'student_list' %}" class="btn btn-secondary">إلغاء والعودة</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
