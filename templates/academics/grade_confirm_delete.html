{% extends 'base.html' %}

{% block title %}تأكيد الحذف{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card shadow border-0 border-top border-danger border-4">
            <div class="card-body p-5">
                <i class="bi bi-exclamation-triangle-fill text-danger display-1 mb-3"></i>
                <h3 class="fw-bold">هل أنت متأكد من الحذف؟</h3>
                <p class="text-muted">أنت على وشك حذف الصف <strong>"{{ object.name }}"</strong>. سيتم حذف جميع الطلاب المرتبطين بهذا الصف (إذا وجدوا) ولا يمكن التراجع.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-lg px-5 mt-3"><i class="bi bi-trash"></i> نعم، احذف</button>
                    <a href="{% url 'grade_list' %}" class="btn btn-outline-secondary btn-lg px-4 mt-3">تراجع</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
