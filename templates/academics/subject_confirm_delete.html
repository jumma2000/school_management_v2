{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card shadow border-0 border-top border-danger border-4 p-4">
            <i class="bi bi-exclamation-triangle-fill text-danger display-1 mb-3"></i>
            <h3 class="fw-bold">هل أنت متأكد من حذف المادة "{{ object.name }}"؟</h3>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-5 mt-3">نعم، احذف</button>
                <a href="{% url 'subject_list' %}" class="btn btn-secondary px-4 mt-3">تراجع</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
