{% extends 'base.html' %}
{% block title %}إضافة شعبة{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white pb-0">
                <h4 class="fw-bold"><i class="bi bi-plus-circle text-primary"></i> إضافة شعبة جديدة</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">الصف</label>
                        <select name="grade" class="form-select" required>
                            <option value="">اختر الصف...</option>
                            {% for grade in grades %}
                            <option value="{{ grade.id }}">{{ grade.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">الشعبة (أ، ب، ج...)</label>
                        <input type="text" name="section" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> حفظ</button>
                    <a href="{% url 'class_list' %}" class="btn btn-secondary">إلغاء</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
