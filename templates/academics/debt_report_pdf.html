<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <style>
    /* هذا السطر هو الأهم */
    @font-face {
        font-family: 'Cairo';
        src: url('static/Cairo-Regular.ttf');
    }
    
    body { 
        font-family: 'Cairo', sans-serif; /* تأكد من كتابة اسم الخط هنا */
        font-size: 12px; 
        color: #333;
    }
    /* ... باقي التنسيقات ... */
</style>

</head>
<body>
    <h2>تقرير المديونيات</h2>
    <p>تاريخ الطباعة: {{ today|date:"Y-m-d" }}</p>
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>اسم الطالب</th>
                <th>الصف</th>
                <th>المديونية</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.grade.name }}</td>
                <td>{{ student.balance|floatformat:2 }}</td>
            </tr>
            {% endfor %}
        </tbody>
        <tfoot>
            <tr>
                <th colspan="3">الإجمالي</th>
                <th>{{ total_debts|floatformat:2 }}</th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
